# Publish to PyPI on a version tag, with trusted publishing (OIDC): no tokens
# stored anywhere. One-time setup on pypi.org: Publishing -> add a pending
# publisher for project "phone-harness-mcp", owner phone-harness, repository
# mcp, workflow publish.yml, environment pypi.
name: publish

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
